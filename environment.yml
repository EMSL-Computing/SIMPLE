name: simple
channels:
  - conda-forge
dependencies:
  - python=3.11
  # AmberTools (including its bundled Packmol) and NWChem are optional.
  # `python install_simple.py` asks which scientific toolchain to install and
  # adds a compatible set after this base.
  - fastapi>=0.115
  - gemmi>=0.7.5
  - jinja2>=3.1.6
  - matplotlib>=3.8
  - mdanalysis>=2.8
  - networkx>=3.0
  - numpy>=1.26,<2
  - openbabel
  - pdb2pqr>=3.6,<4
  - pip
  - platformdirs>=4.0
  - python-multipart>=0.0.18
  - propka>=3.5
  - pydantic>=2.12
  - pyside6>=6.7
  - rdkit
  - requests>=2.32.4
  - rich>=14.3
  - tomlkit>=0.14
  - typer>=0.24
  - uvicorn>=0.32
  - pip:
      - .
