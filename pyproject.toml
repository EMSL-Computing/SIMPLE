[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "simple-ree"
version = "0.1.0"
description = "SIMPLE molecular-simulation workflow automation for rare earth element systems."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Battelle Memorial Institute license; see README.md" }
authors = [
  { name = "Kim H." }
]
dependencies = [
  "fastapi>=0.115",
  "gemmi>=0.7.5",
  "jinja2>=3.1.6",
  "matplotlib>=3.8",
  "MDAnalysis>=2.8",
  "mpi4py>=4.0",
  "networkx>=3.0",
  "numpy>=2.0",
  "python-multipart>=0.0.9",
  "PySide6>=6.7",
  "propka>=3.5",
  "pydantic>=2.12",
  "requests>=2.32",
  "rich>=14.3",
  "tomlkit>=0.14",
  "typer>=0.24",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
simple = "amber_metallo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amber_metallo"]
include = [
  "src/amber_metallo/qm/templates/*.tmpl",
  "src/amber_metallo/qm/editor/assets/*",
  "src/amber_metallo/gui_app/web_static/*",
  "src/amber_metallo/data/opc_duvail/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
